<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handa’s Surprise – Blitzlesen für Kinder</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#282521;background:#fff9e9}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(26px,5vw,42px);margin:0}h2{font-size:20px}.panel{background:white;border:2px solid #e9b72f;border-radius:20px;padding:18px;margin-top:18px;box-shadow:0 4px 0 #f4e5b8}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-weight:650}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #cbbd9e}input[type=number]{width:95px}button{cursor:pointer;background:#f7c948;border:0;font-weight:750}button.secondary{background:#f3eee2}button:disabled{opacity:.4}.stage{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}.flash{font-size:clamp(45px,10vw,90px);font-weight:800;overflow-wrap:anywhere}.stage img{max-height:170px;max-width:85%;object-fit:contain}.muted{color:#736d61}.hidden{display:none!important}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f5e8bd;padding:7px 12px;border-radius:30px}.editor{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.editor input{width:100%}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #eee}td img{width:45px;height:40px;object-fit:contain}small{line-height:1.5}#status{font-weight:650;color:#705b16}</style><main><header><h1>🍍 Handa’s Surprise</h1><p>Englisch-Blitzlesen · Nouns, Adjectives & Verbs</p></header><section class="panel"><h2>Wähle deine Übung</h2><div class="controls"><label>Wortgruppe<select id="category"><option>Alle Wörter</option><option>Nouns</option><option>Adjectives</option><option>Verbs</option></select></label><label>Wort sichtbar (Sek.)<input id="flashTime" type="number" min="0.2" max="10" step="0.1" value="1"></label><label>Denkpause (Sek.)<input id="thinkTime" type="number" min="0" max="20" step="0.5" value="2"></label><label>Auflösung (Sek.)<input id="revealTime" type="number" min="1" max="30" step="0.5" value="4"></label></div><p><label style="display:inline-flex;align-items:center"><input id="shuffle" type="checkbox" checked> Wörter mischen</label>　<label style="display:inline-flex;align-items:center"><input id="speak" type="checkbox" checked> Englische Aussprache</label></p><div class="controls"><button id="start" disabled>▶ Starten</button><button id="pause" class="secondary" disabled>⏸ Pause</button><button id="stop" class="secondary" disabled>■ Stoppen</button></div></section><section class="panel"><div id="status">Wörter werden geladen …</div><div class="stage" id="stage"><p class="muted">Gleich geht’s los! 🍎</p></div></section><p class="muted"><small>Für die englische Aussprache muss die Sprachausgabe des Geräts verfügbar sein.</small></p></main><script>
const $=id=>document.getElementById(id);let data=[],timers=[],queue=[],index=0,running=false,paused=false,phase=0;const stage=$('stage');function escapeHtml(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function clear(){timers.forEach(clearTimeout);timers=[];speechSynthesis.cancel()}function schedule(fn,ms){timers.push(setTimeout(fn,ms))}function seconds(id){return Math.max(0,Number($(id).value)||0)*1000}function say(w){if(!$('speak').checked||!('speechSynthesis' in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u)}function step(){if(!running||paused)return;if(index>=queue.length){running=false;$('status').textContent='Fertig! 🎉 '+queue.length+' Wörter geübt.';stage.innerHTML='<div class="flash">Great job! 🌟</div>';buttons();return}let w=queue[index];$('status').textContent=(index+1)+' / '+queue.length+' · '+w.category;phase=0;stage.innerHTML='<div class="flash">'+escapeHtml(w.word)+'</div>';schedule(()=>{if(!running||paused)return;phase=1;stage.innerHTML='<p class="muted">Was hast du gelesen? 🤔</p>';schedule(()=>{if(!running||paused)return;phase=2;stage.innerHTML=(w.image?'<img src="'+w.image+'">':'')+'<div class="flash" style="font-size:clamp(36px,7vw,64px)">'+escapeHtml(w.word)+'</div><button onclick="sayCurrent()">🔊 Noch einmal anhören</button>';say(w.word);schedule(()=>{index++;step()},seconds('revealTime'))},seconds('thinkTime'))},seconds('flashTime'))}window.sayCurrent=()=>{if(queue[index])say(queue[index].word)};function buttons(){$('start').disabled=running;$('stop').disabled=!running;$('pause').disabled=!running;$('pause').textContent=paused?'▶ Fortsetzen':'⏸ Pause'}$('start').onclick=()=>{clear();queue=data.filter(w=>$('category').value==='Alle Wörter'||w.category===$('category').value);if($('shuffle').checked)queue.sort(()=>Math.random()-.5);if(!queue.length){alert('Keine Wörter in dieser Kategorie.');return}index=0;running=true;paused=false;buttons();step()};$('stop').onclick=()=>{clear();running=false;paused=false;$('status').textContent='Gestoppt';stage.innerHTML='<p>Wähle Starten für eine neue Runde.</p>';buttons()};$('pause').onclick=()=>{if(!paused){clear();paused=true;$('status').textContent='Pausiert';}else{paused=false;step()}buttons()};
async function load(){try{const r=await fetch('./woerter.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(!Array.isArray(x)||!x.every(w=>typeof w.word==='string'&&typeof w.category==='string'))throw Error('Ungültige Daten');data=x;$('status').textContent=data.length+' Wörter bereit – wähle Starten';$('start').disabled=false;stage.innerHTML='<p class="muted">Wähle eine Wortgruppe und drücke Starten.</p>'}catch(e){$('status').textContent='Wörter konnten nicht geladen werden';stage.textContent='Bitte später erneut versuchen oder die Lehrkraft informieren.';console.error(e)}}load();</script></html>
